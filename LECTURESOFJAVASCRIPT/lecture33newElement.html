<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <div class="school">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
    <script>
        const parent = document.querySelector('.school');
        console.log(parent.children); // children property

        for (let i = 0; i < parent.children.length; i++) {
            console.log(parent.children[i]);
        }
        parent.children[1].style.color = "red";
        console.log(parent.firstElementChild); // property
        console.log(parent.lastElementChild); // property

        const dayOne = document.querySelector('.day');
        console.log(dayOne);
        console.log(dayOne.parentElement); // property
        console.log(dayOne.nextElementSibling); // property


        console.log(parent.childNodes);



        // creating element
        const div = document.createElement('div')
        div.className="Prince"
        div.id="id1" // or div.id=Math.random()
        div.setAttribute("title","anyone") 
        // div.innerText="chai aur code"
        //           or         
        const addText =document.createTextNode("chai aur code")
        div.appendChild(addText) // ye element jo hum banaye h vo abhi memory m hai means abhi page pr show nhi ho rha , show karane k leye usko attach karana padega

        document.body.appendChild(div) // ab page pr display karega // attach hogya h 
    </script>
</body>
</html>
