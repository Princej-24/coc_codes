    // this is the code to remove image by just clicking on them // this is the one way 
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.parentNode);
        let removeIt = e.target.parentNode;
        // removeIt.remove();  // or
        removeIt.parentNode.removeChild(removeIt)
    }) 
    // yha dikkat ye aa rhi h ki agar tum kisi li pr click kroge ya fhir google pr kroge tho pura page hi gayab ho jayega qki tum yha parentNode remove kr rhe ho jo ki ul h 


    // another way to remove
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName);
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id);
            let removeIt = e.target.parentNode
            removeIt.remove()
        }
    })
    // ab yha bs IMG hi gayeb hoga na ki li elements and google
